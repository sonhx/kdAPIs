# Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Customizes the path for the raw OpenAPI JSON metadata
springdoc.api-docs.path=/api-docs

# Print debug logs for Spring Web request routing and missing endpoints
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.resource=DEBUG

logging.file.name=logs/kdAPIs.log



# Forces Swagger UI to prepend the service name to the execution paths
# springdoc.server.url=/kdAPIs
server.servlet.context-path=/kdAPIs

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s


# API key for Slink (if needed)
slink.api-key="4sUgLOsrtFOkjQ84ar9kvVwjByhAiQPs"

server.port=8080

# HTTP Servlet Character Encoding Settings (UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# Multipart Upload Size Limits (500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Enable GZIP Response Compression (reduces 183KB payload to ~15KB)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript
server.compression.min-response-size=1024

# Tomcat Persistent Connection Keep-Alive
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=1000

spring.main.lazy-initialization=true
