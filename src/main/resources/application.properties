spring.application.name=kdAPIs

# Primary Database Driver & Spring Datasource defaults
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Global Hikari defaults to prevent idle connection closure by DB/OS
spring.datasource.hikari.maximum-pool-size=30
#spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=120000

